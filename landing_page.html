<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletic Performance Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('/path/to/background.jpg') no-repeat center center/cover;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4); /* Soft overlay */
            backdrop-filter: blur(5px); /* Smooth blur effect */
            z-index: -1;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-icons {
            display: flex;
            gap: 15px;
        }

        .icon {
            width: 40px;
            height: 40px;
            padding: 8px;
            border: 1px solid #e1e4e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px 0;
            align-items: center;
            min-height: 80vh;
        }

        .hero-content h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #1a1a1a;
            font-weight: 600;
        }

        .hero-content p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }

        .hero-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            width: 450px;    /* Set a fixed width */
            height: 530px;   /* Set a fixed height */
            background: #f0f4f8;
            margin: 0 auto;  /* Center it horizontally */
}


        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Buttons */
        .button {
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .primary-button {
            background-color: #000;
            color: white;
            border: none;
        }

        .secondary-button {
            background-color: white;
            color: #000;
            border: 1px solid #e1e4e8;
        }

        /* Stats Card */
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 300px;
            margin-top: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .stats-card:hover {
            transform: translateY(-5px);
        }

        .stats-icon {
            width: 50px;
            height: 50px;
            background: #e8f0fe;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats-content h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .stats-content p {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        /* Tags */
        .tags {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
        }

        .logo {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-content h1 {
                font-size: 2.5rem;
            }

            .nav-icons {
                display: none;
            }

            .hero-image {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav>
            <div class="auth-buttons">
                <a href="#" class="button secondary-button">Log In</a>
                <a href="#" class="button primary-button">Sign Up</a>
            </div>
            <!-- <div class="nav-icons">
                <div class="icon">🏃</div>
                <div class="icon">⭐</div>
                <div class="icon">🚴</div>
            </div> -->
            <div class="menu">
                <a href="#" class="button secondary-button">Menu</a>
            </div>
        </nav>

        <!-- Hero Section -->
        <div class="hero">
            <div class="hero-content">
                <p>Your Path to Healthier Living.</p>
                <h1>Personalized Nutrition Insights for You</h1>
                <a href="#" class="button primary-button">Find Your Meal Plan</a>

                <div class="stats-card">
                    <div class="stats-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        </svg>
                    </div>
                    <div class="stats-content">
                        <h3>Smart Meal Recommendations</h3>
                        <p>10K+ Personalized Plans Created</p>
                    </div>
                </div>
            </div>
            <div class="hero-image">
                <div class="logo"></div>
                <img src=".\img\run.jpg" alt="Athlete Running" style="object-position: 50% 50%;" />
                <div class="tags">
                    <span class="tag">Healthy</span>
                    <span class="tag">Personalized</span>
                    <span class="tag">Real-Time</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
